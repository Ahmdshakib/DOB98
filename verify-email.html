<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify DOB98 Email</title><link rel="stylesheet" href="css/app.css"></head><body><main style="max-width:560px;margin:12vh auto"><section class="panel auth-card"><div class="auth-brand">DOB<span class="gold">98</span></div><h2>Email verification</h2><p class="muted" id="result">Checking your verification link…</p><a class="btn btn-gold" href="index.html#login">Continue to login</a></section></main><script>(()=>{const p=new URLSearchParams(location.search),t=p.get('token'),out=document.querySelector('#result');if(!t){out.textContent='Verification token is missing.';return}const api=(window.DOB98_API_BASE||'http://localhost:3000/api').replace(/\\/$/,'');fetch(api+'/auth/verify-email?token='+encodeURIComponent(t)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed');out.textContent=d.message||'Email verified.'}).catch(e=>out.textContent=e.message+' Make sure the API is running.')})();</script></body></html>
